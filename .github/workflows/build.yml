name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: osx
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BwPicker.sln -c Release -p:TargetOS=${{ matrix.target }}

      - name: Regression checks
        run: dotnet run --project tests/BwPicker.Tests -c Release --no-build -p:TargetOS=${{ matrix.target }}

      - name: Vulnerable package check
        run: dotnet list BwPicker.sln package --vulnerable --include-transitive

  # The tag (v1.2.3) becomes the app version; the in-app updater compares against it.
  package-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tags must look like v1.2.3" }
          dotnet publish src/BwPicker/BwPicker.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=$version -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/BwPicker.exe, publish/*.dll, scripts/Install-Admin.ps1, LICENSE, README.md, SECURITY.md -DestinationPath BwPicker-win-x64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: BwPicker-win-x64.zip

  package-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tags must look like v1.2.3"; exit 1; }
          dotnet publish src/BwPicker/BwPicker.csproj -c Release -r linux-${{ matrix.arch }} --self-contained true             -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=$version -o publish

      # zip keeps the executable bit, so the unpacked app runs as is.
      - name: Package
        run: |
          mkdir pkg
          cp publish/BwPicker publish/*.so scripts/install-linux.sh src/BwPicker/assets/bw-picker.png LICENSE README.md SECURITY.md pkg/
          chmod 755 pkg/BwPicker pkg/install-linux.sh
          (cd pkg && zip -X -9 ../BwPicker-linux-${{ matrix.arch }}.zip *)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: BwPicker-linux-${{ matrix.arch }}.zip

  # Also on pull requests, so the app bundle is checked before a release (without publishing anything).
  package-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    needs: build
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tags must look like v1.2.3"; exit 1; }
          else
            version="0.0.0-pr"
          fi
          sh scripts/package-macos.sh ${{ matrix.arch }} "$version"
          # The updater only takes BwPicker.app/Contents/MacOS/* from this zip.
          unzip -l BwPicker-macos-${{ matrix.arch }}.zip | grep -q " BwPicker.app/Contents/MacOS/BwPicker$"

      # The runner is Apple silicon: start the arm64 app, check it stays up, and keep a screenshot for review.
      - name: Smoke test
        if: matrix.arch == 'arm64'
        run: |
          pkg/BwPicker.app/Contents/MacOS/BwPicker --version
          open pkg/BwPicker.app
          sleep 15
          pgrep -x BwPicker
          screencapture -x smoke.png || true
          pkill -x BwPicker || true
          app=pkg/BwPicker.app/Contents/MacOS/BwPicker
          "$app" --preview --query disc --snapshot preview-picker.png
          "$app" --preview --settings --snapshot preview-settings.png
          "$app" --preview --dark --unlock --snapshot preview-unlock-dark.png

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.arch == 'arm64' && always()
        with:
          name: macos-smoke
          path: |
            smoke.png
            preview-*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: BwPicker-macos-${{ matrix.arch }}.zip

  release:
    needs: [package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum BwPicker-win-x64.zip BwPicker-linux-x64.zip BwPicker-linux-arm64.zip BwPicker-macos-arm64.zip BwPicker-macos-x64.zip > SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            BwPicker-win-x64.zip
            BwPicker-linux-x64.zip
            BwPicker-linux-arm64.zip
            BwPicker-macos-arm64.zip
            BwPicker-macos-x64.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} BwPicker-win-x64.zip BwPicker-linux-x64.zip BwPicker-linux-arm64.zip BwPicker-macos-arm64.zip BwPicker-macos-x64.zip SHA256SUMS.txt --generate-notes --repo ${{ github.repository }}
