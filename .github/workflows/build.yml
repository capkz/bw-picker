name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BwPicker.sln -c Release

      - name: Regression checks
        run: dotnet run --project tests/BwPicker.Tests -c Release --no-build

      - name: Vulnerable package check
        run: dotnet list BwPicker.sln package --vulnerable --include-transitive

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The tag (v1.2.3) becomes the app version; the in-app updater compares against it.
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tags must look like v1.2.3" }
          dotnet publish src/BwPicker/BwPicker.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:Version=$version -o publish

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/BwPicker.exe, LICENSE, README.md, SECURITY.md -DestinationPath BwPicker-win-x64.zip
          $hash = (Get-FileHash BwPicker-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          # LF line endings so `sha256sum -c SHA256SUMS.txt` works on any platform.
          [IO.File]::WriteAllText("SHA256SUMS.txt", "$hash  BwPicker-win-x64.zip`n")

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: BwPicker-win-x64.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} BwPicker-win-x64.zip SHA256SUMS.txt --generate-notes
